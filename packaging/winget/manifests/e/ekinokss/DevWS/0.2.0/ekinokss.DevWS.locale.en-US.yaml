ShortDescription: A configuration-driven workspace orchestrator for Windows.
Description: >-
  DevWS restores and manages a complete multi-window development environment from a
  single declarative configuration: Windows Terminal windows and tabs, desktop
  applications, window geometry, and global hotkeys. It supports workspace sets,
  layout capture and restore, topology-aware layout profiles, live-state saving, and
  read-only inspection commands. Installation registers the product per user and
  creates the protected DevWS scheduled tasks used for privileged operations.
