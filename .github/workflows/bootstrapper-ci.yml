name: Bootstrapper CI

# Phase-4 setup validation. Feature-branch pushes run fixture-payload
# lifecycle acceptance only. A manual dispatch additionally builds one
# production release candidate, verifies it before upload, retains it as an
# Actions artifact for 30 days, downloads it in a separate job and verifies the
# downloaded copy. No tag, GitHub Release, release asset, attestation or WinGet
# package is produced.

on:
  workflow_dispatch:
  push:
    branches: [v0.2/winget-distribution]

permissions:
  contents: read

jobs:
  bootstrapper:
    name: Native AOT bootstrapper on windows-latest
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5
        with:
          dotnet-version: 10.0.x

      - name: Build fixture bootstrapper and run acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoLogo -NoProfile -File packaging/test-bootstrapper.ps1
          if ($LASTEXITCODE -ne 0) { throw "bootstrapper acceptance exited $LASTEXITCODE" }

      - name: Verify the repository stayed clean
        shell: pwsh
        run: |
          $status = @(git status --porcelain=v1)
          if ($status.Count -gt 0) {
              $status | ForEach-Object { Write-Output $_ }
              throw 'bootstrapper validation left repository changes'
          }
          Write-Output 'repository clean'

  release-candidate:
    name: Production release candidate on windows-latest
    needs: bootstrapper
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5
        with:
          dotnet-version: 10.0.x

      - name: Build production release candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'devws-release-candidate'
          if (Test-Path -LiteralPath $bundle) { Remove-Item -LiteralPath $bundle -Recurse -Force }
          & pwsh -NoLogo -NoProfile -File packaging/build-release.ps1 -OutputDir $bundle
          if ($LASTEXITCODE -ne 0) { throw "release build exited $LASTEXITCODE" }

      - name: Verify release candidate locally
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'devws-release-candidate'
          & pwsh -NoLogo -NoProfile -File packaging/verify-release.ps1 -BundleDir $bundle -ExpectedSourceSha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "release verification exited $LASTEXITCODE" }
          $status = @(git status --porcelain=v1)
          if ($status.Count -gt 0) { throw 'release build left repository changes' }
          Write-Output 'repository clean'

      - name: Determine release artifact name
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $product = Get-Content -LiteralPath packaging/product.json -Raw | ConvertFrom-Json
          $sha = (& git rev-parse HEAD).Trim()
          $name = "devws-$($product.version)-win-x64-$sha"
          "artifact_name=$name" >> $env:GITHUB_OUTPUT
          "version=$($product.version)" >> $env:GITHUB_OUTPUT
          "source_sha=$sha" >> $env:GITHUB_OUTPUT
          "artifact_name=$name" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "source_sha=$sha" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload immutable release candidate
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ${{ runner.temp }}/devws-release-candidate
          if-no-files-found: error
          retention-days: 30
          overwrite: false

      - name: Record artifact metadata
        shell: pwsh
        run: |
          "artifact_id=${{ steps.upload.outputs.artifact-id }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "artifact_url=${{ steps.upload.outputs.artifact-url }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "artifact_digest=${{ steps.upload.outputs.artifact-digest }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  verify-downloaded-release:
    name: Verify downloaded release candidate on windows-latest
    needs: release-candidate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download exactly the release-candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ needs.release-candidate.outputs.artifact_name }}
          path: ${{ runner.temp }}/devws-downloaded-release

      - name: Verify downloaded release candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $env:RUNNER_TEMP 'devws-downloaded-release'
          & pwsh -NoLogo -NoProfile -File packaging/verify-release.ps1 -BundleDir $bundle -ExpectedSourceSha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "downloaded release verification exited $LASTEXITCODE" }
          $status = @(git status --porcelain=v1)
          if ($status.Count -gt 0) { throw 'downloaded release verification left repository changes' }
          Write-Output 'downloaded release candidate verified; repository clean'
